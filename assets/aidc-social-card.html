<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The AI Receipts — social card</title>
<style>
  :root {
    --bg: #0a0e14;
    --surface: #12181f;
    --line: #232b36;
    --ink: #e6edf3;
    --muted: #8b98a5;
    --accent: #5b9dff;
    --gap: #fb7185;
    --announced: #f59e0b;
    --construction: #3b82f6;
    --operational: #10b981;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    background: var(--bg);
    border: 1px solid var(--line);
  }

  /* map motif, right side */
  .map-group {
    position: absolute;
    right: 44px;
    top: 50%;
    transform: translateY(-50%);
    width: 500px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .map-box { width: 500px; height: 282px; }
  .map-box svg { display: block; width: 100%; height: 100%; }
  .map-legend {
    margin-top: 16px;
    display: flex;
    gap: 1.1rem;
    font-size: 12px;
    color: var(--muted);
  }
  .map-legend span { display: inline-flex; align-items: center; gap: .4rem; }
  .map-legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  /* text column, left side */
  .col {
    position: absolute;
    left: 64px;
    top: 0;
    bottom: 0;
    width: 600px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .eyebrow {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .09em;
    color: var(--accent);
    margin: 0 0 18px;
  }
  h1 {
    margin: 0 0 18px;
    font-size: 58px;
    font-weight: 700;
    letter-spacing: -0.015em;
    line-height: 1.03;
    color: var(--ink);
  }
  p.sub {
    margin: 0 0 30px;
    font-size: 21px;
    line-height: 1.45;
    color: var(--muted);
    max-width: 500px;
  }
  p.sub strong { color: var(--ink); font-weight: 600; }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, auto);
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    width: fit-content;
    margin-bottom: 34px;
  }
  .stat {
    background: var(--surface);
    padding: 14px 22px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .stat b { font-size: 27px; line-height: 1; letter-spacing: -0.01em; color: var(--ink); }
  .stat b.gap { color: var(--gap); }
  .stat span { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }

  .url {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 20px;
    font-weight: 600;
    color: var(--accent);
  }
  .url::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    display: inline-block;
  }
</style>
</head>
